# Scrape targets for a RisingWave cluster on Railway. Job names match the ones
# upstream's own docker/prometheus.yaml uses, so the PromQL the meta dashboard
# and the published Grafana dashboards emit resolves unchanged.
global:
  scrape_interval: 15s
  evaluation_interval: 60s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["[::1]:9500"]

  - job_name: meta
    static_configs:
      - targets: ["meta.railway.internal:1250"]

  - job_name: compute
    static_configs:
      - targets: ["compute.railway.internal:1222"]

  - job_name: compactor
    static_configs:
      - targets: ["compactor.railway.internal:1260"]

  - job_name: frontend
    static_configs:
      - targets: ["frontend.railway.internal:2222"]
